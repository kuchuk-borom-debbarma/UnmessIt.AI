[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.2",
    "fastcoref>=2.1.6",
    "langchain>=1.3.10",
    "langchain-core>=1.4.8",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0.1",
    "markdown-it-py>=4.2.0",
    "protobuf>=7.35.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "sentencepiece>=0.2.1",
    "uvicorn>=0.49.0",
    "wtpsplit>=2.2.1",
    "chromadb>=1.5.9",
    "langgraph>=1.2.6",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
