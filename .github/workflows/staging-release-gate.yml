name: Staging release gate

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch staging
        run: git fetch origin staging:refs/remotes/origin/staging
      - name: Require version and changelog bump
        run: node scripts/validate_release_gate.js origin/staging
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Generate version.json
        run: node scripts/generate_version.js
      - name: Verify generated version.json exists
        run: test -s web/public/version.json
      - name: Lint web
        working-directory: web
        run: npm run lint
      - name: Build web
        working-directory: web
        run: npm run build
