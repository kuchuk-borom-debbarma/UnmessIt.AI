  <path fill="none" stroke="url(#thread)" stroke-linecap="round" stroke-linejoin="round" stroke-width="6.5" filter="url(#glow)" d="M27 58c7-11 20 9 27-1 5-7-7-13-13-8-8 7 6 18 18 8 8-7 9-18 9-32"/>
  <path fill="none" stroke="#34d399" stroke-linecap="round" stroke-linejoin="round" stroke-width="6.5" d="m59 50 7 7 13-17"/>
  <circle cx="27" cy="58" r="4.5" fill="#34d399"/>
  <circle cx="68" cy="25" r="4.5" fill="#a78bfa"/>
