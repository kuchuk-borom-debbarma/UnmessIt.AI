<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">UnmessIt.AI mark</title>
  <desc id="desc">A tangled thread resolving into a clean knowledge path inside a U-shaped mark.</desc>
  <defs>
    <linearGradient id="bg" x1="14" x2="82" y1="12" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="thread" x1="20" x2="78" y1="72" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset=".48" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feColorMatrix in="blur" values="0 0 0 0 0.20 0 0 0 0 0.83 0 0 0 0 0.65 0 0 0 .45 0"/>
