  </defs>
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  <path fill="#020617" fill-opacity=".35" d="M18 24c0-5.5 4.5-10 10-10h40c5.5 0 10 4.5 10 10v48c0 5.5-4.5 10-10 10H28c-5.5 0-10-4.5-10-10V24Z"/>
